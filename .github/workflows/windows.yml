# Сборка установщика Блокнота для Windows.
# Запуск: вкладка Actions → «Блокнот для Windows» → Run workflow.
# Готовый установщик появится в разделе Releases (и в артефактах запуска).
name: Блокнот для Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установка Tauri CLI
        run: npm install

      - name: Сборка и публикация установщика
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Блокнот для Windows __VERSION__
          releaseBody: Скачайте файл, который заканчивается на «x64-setup.exe», и запустите его.
          releaseDraft: false
          prerelease: false

      - name: Установщик в артефакты запуска
        uses: actions/upload-artifact@v4
        with:
          name: bloknot-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
